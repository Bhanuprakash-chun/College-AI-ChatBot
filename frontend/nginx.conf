server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads go through this proxy; keep in step with MAX_UPLOAD_MB.
  client_max_body_size 30m;

  # API: strip the /api prefix and forward to FastAPI.
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx is the edge: overwrite (never append to) any client-supplied value,
    # so the address uvicorn trusts cannot be spoofed to dodge rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A CPU-only 3B model can take a while on the first answer.
    proxy_read_timeout 180s;
  }

  # Long-lived caching for fingerprinted build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: every other path serves the SPA.
  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
